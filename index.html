<!doctype html>
<html lang="en">
	<head>
		<title>NPR Sketch shader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body {
				color: #fff;
				font-family: tahoma, sans-serif;
				font-size: 13px;
				background-color: #222;
				overflow: hidden;
			}
			a { color: white; text-shadow: 0 1px 0 rgba( 0, 0, 0, .5 ); }
			canvas { position: fixed; left: 0; top: 0; display: block; touch-action: none; }
			#title { position: absolute; z-index: 1; left: 10px; top: 10px; right: 10px; line-height: 1.4em; text-shadow: 0 1px 0 rgba( 0, 0, 0, .6 ); pointer-events: none; }
			#title a { pointer-events: auto; }
			#title p { margin-bottom: 10px; }
		</style>
		<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
				"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
			}
		}
		</script>
	</head>
	<body>

		<div id="title">
			<p><b>NPR Sketch shader</b> · postprocessing with GLSL</p>
			<p>Based on <a href="http://www.thomaseichhorn.de/npr-sketch-shader-vvvv/" target="_blank" rel="noopener">Thomas Eichhorn's vvvv shader</a>.</p>
			<p>Coded by Jaume Sanchez <a href="https://twitter.com/thespite" target="_blank" rel="noopener">@thespite</a> with <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a>. Find the code on <a href="https://github.com/spite/npr-shading" target="_blank" rel="noopener">GitHub</a>.<br>
			Click and drag to move the camera, scroll or pinch to zoom.</p>
		</div>

<script type="x-shader/x-vertex" id="vs-quad">

	varying vec2 vUv;

	void main() {

		vUv = uv;
		gl_Position = vec4( position.xy, 0., 1. );

	}

</script>

<script type="x-shader/x-fragment" id="fs-blur">

	varying vec2 vUv;
	uniform sampler2D tDiffuse;
	uniform vec2 delta;

	float random( vec3 scale, float seed ) { return fract( sin( dot( gl_FragCoord.xyz + seed, scale ) ) * 43758.5453 + seed ); }

	void main() {

		vec4 color = vec4( 0. );
		float total = 0.;
		float offset = random( vec3( 12.9898, 78.233, 151.7182 ), 0. );

		for ( float t = - 30.; t <= 30.; t ++ ) {

			float percent = ( t + offset - .5 ) / 30.;
			float weight = 1. - abs( percent );
			color += texture2D( tDiffuse, vUv + delta * percent ) * weight;
			total += weight;

		}

		gl_FragColor = color / total;

	}

</script>

<script type="x-shader/x-vertex" id="vs-scene">

	varying vec3 vNormal;
	varying vec3 vPosition;
	varying vec3 vLight;

	// at the ball
	const vec4 lightPosition = vec4( 0., 0., - 10., 1. );

	void main() {

		vec4 mvPosition = modelViewMatrix * vec4( position, 1. );
		gl_Position = projectionMatrix * mvPosition;
		vNormal = normalMatrix * normal;
		vPosition = mvPosition.xyz;
		vLight = ( viewMatrix * lightPosition ).xyz;

	}

</script>

<script type="x-shader/x-fragment" id="fs-scene">

	varying vec3 vNormal;
	varying vec3 vPosition;
	varying vec3 vLight;

	uniform float renderDepth;

	void main() {

		vec3 n = normalize( vNormal );

		if ( renderDepth == 0. ) {

			// ambient and diffuse, in grey
			vec3 s = normalize( vLight - vPosition );
			gl_FragColor = vec4( vec3( .1 ) + vec3( .75 ) * max( 0., dot( n, s ) ), 1. );

		} else {

			// the normal in red and green, and how near it is in blue, for the edges
			gl_FragColor = vec4( .5 * ( 1. + n.x ), .5 * ( 1. + n.y ), min( 1., gl_FragCoord.w * 10. ), 1. );

		}

	}

</script>

<script type="x-shader/x-fragment" id="fs-render">

	uniform sampler2D tDiffuse;
	uniform sampler2D tColor;
	uniform sampler2D tNoise;
	uniform sampler2D tPaper;
	uniform sampler2D tBlur;
	uniform vec2 resolution;

	varying vec2 vUv;

	void main() {

		// edges of the normals and the depth, one point of the page apart at any pixel ratio
		float x = 1. / resolution.x;
		float y = 1. / resolution.y;
		vec4 horizEdge = vec4( 0. );
		horizEdge -= texture2D( tDiffuse, vec2( vUv.x - x, vUv.y - y ) ) * 1.;
		horizEdge -= texture2D( tDiffuse, vec2( vUv.x - x, vUv.y     ) ) * 2.;
		horizEdge -= texture2D( tDiffuse, vec2( vUv.x - x, vUv.y + y ) ) * 1.;
		horizEdge += texture2D( tDiffuse, vec2( vUv.x + x, vUv.y - y ) ) * 1.;
		horizEdge += texture2D( tDiffuse, vec2( vUv.x + x, vUv.y     ) ) * 2.;
		horizEdge += texture2D( tDiffuse, vec2( vUv.x + x, vUv.y + y ) ) * 1.;
		vec4 vertEdge = vec4( 0. );
		vertEdge -= texture2D( tDiffuse, vec2( vUv.x - x, vUv.y - y ) ) * 1.;
		vertEdge -= texture2D( tDiffuse, vec2( vUv.x    , vUv.y - y ) ) * 2.;
		vertEdge -= texture2D( tDiffuse, vec2( vUv.x + x, vUv.y - y ) ) * 1.;
		vertEdge += texture2D( tDiffuse, vec2( vUv.x - x, vUv.y + y ) ) * 1.;
		vertEdge += texture2D( tDiffuse, vec2( vUv.x    , vUv.y + y ) ) * 2.;
		vertEdge += texture2D( tDiffuse, vec2( vUv.x + x, vUv.y + y ) ) * 1.;
		vec3 edge = sqrt( horizEdge.rgb * horizEdge.rgb + vertEdge.rgb * vertEdge.rgb );
		float e = length( edge );

		float z = texture2D( tDiffuse, vUv ).b;

		// the shading, screened over a blurred copy of itself
		vec3 b = texture2D( tColor, vUv ).rgb;
		vec3 a = texture2D( tBlur, vUv ).rgb;
		vec3 c = vec3( 1. ) - ( vec3( 1. ) - a ) * ( vec3( 1. ) - b );

		// pencil grain where it's dark, and the lines
		float s = mix( 1., texture2D( tNoise, mod( vUv * resolution / 256., 1. ) ).r, 1. - c.r );
		s -= .15 * e * z;

		// the paper, a tile of 1200 points from the bottom left
		vec3 color = texture2D( tPaper, mod( vUv * resolution / 1200., 1. ) ).rgb * s;

		gl_FragColor = vec4( color, 1. );

	}

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer( { antialias: true } );
renderer.setPixelRatio( Math.min( 2, window.devicePixelRatio ) );
document.body.appendChild( renderer.domElement );

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 1000 );
camera.position.set( 0, 10, 10 );

const controls = new OrbitControls( camera, renderer.domElement );

const material = new THREE.ShaderMaterial( {
	uniforms: { renderDepth: { value: 0 } },
	vertexShader: document.getElementById( 'vs-scene' ).textContent,
	fragmentShader: document.getElementById( 'fs-scene' ).textContent
} );

const meshes = [];
const box = new THREE.BoxGeometry( 1, 1, 1 );
const s = 3, d = 40;

for ( let j = 0; j < 200; j ++ ) {

	const mesh = new THREE.Mesh( box, material );
	mesh.scale.set( 1 + Math.random() * s, 1 + Math.random() * s, 1 + Math.random() * s );
	mesh.position.set( ( .5 - Math.random() ) * d, ( .5 - Math.random() ) * d, ( .5 - Math.random() ) * d );
	mesh.rotation.set( Math.random() * 2 * Math.PI, Math.random() * 2 * Math.PI, Math.random() * 2 * Math.PI );
	scene.add( mesh );
	meshes.push( mesh );

}

// where the light is
const ball = new THREE.Mesh( new THREE.SphereGeometry( 1, 20, 20 ), new THREE.MeshNormalMaterial() );
ball.position.set( 0, 0, - 10 );
scene.add( ball );

// ---- the passes: shading, a blurred copy of it at half the size, and the normals and depth

const target = () => new THREE.WebGLRenderTarget( 1, 1, { type: THREE.HalfFloatType } );
const colorBuffer = target();
const normalBuffer = target();
const blurBuffers = [ target(), target() ];

const quadGeometry = new THREE.PlaneGeometry( 2, 2 );
const quad = fragmentShader => new THREE.Mesh( quadGeometry, new THREE.ShaderMaterial( {
	uniforms: {},
	vertexShader: document.getElementById( 'vs-quad' ).textContent,
	fragmentShader: document.getElementById( fragmentShader ).textContent,
	depthTest: false,
	depthWrite: false
} ) );
const quadCamera = new THREE.Camera();

const blur = quad( 'fs-blur' );
blur.material.uniforms = { tDiffuse: { value: null }, delta: { value: new THREE.Vector2() } };

const loader = new THREE.TextureLoader();
const noise = loader.load( 'assets/noise.png' );
const paper = loader.load( 'assets/brown.jpg' );

const final = quad( 'fs-render' );
final.material.uniforms = {
	tDiffuse: { value: normalBuffer.texture },
	tColor: { value: colorBuffer.texture },
	tBlur: { value: blurBuffers[ 1 ].texture },
	tNoise: { value: noise },
	tPaper: { value: paper },
	resolution: { value: new THREE.Vector2( 1, 1 ) }
};

function draw( mesh, to ) {

	renderer.setRenderTarget( to );
	renderer.render( mesh, quadCamera );

}

function resize() {

	const w = window.innerWidth, h = window.innerHeight, ratio = renderer.getPixelRatio();

	renderer.setSize( w, h );
	camera.aspect = w / h;
	camera.updateProjectionMatrix();

	colorBuffer.setSize( w * ratio, h * ratio );
	normalBuffer.setSize( w * ratio, h * ratio );
	for ( const buffer of blurBuffers ) buffer.setSize( Math.ceil( w / 2 ), Math.ceil( h / 2 ) );

	final.material.uniforms.resolution.value.set( w, h );

}

window.addEventListener( 'resize', resize );
resize();

const clock = new THREE.Clock();
const blurAmount = .1;

function render() {

	requestAnimationFrame( render );

	const delta = clock.getDelta();

	for ( const mesh of meshes ) {

		mesh.rotation.x += delta * .1;
		mesh.rotation.y += delta * .11;
		mesh.rotation.z += delta * .12;

	}

	controls.update();

	material.uniforms.renderDepth.value = 0;
	renderer.setClearColor( 0xffffff );
	renderer.setRenderTarget( colorBuffer );
	renderer.render( scene, camera );

	blur.material.uniforms.tDiffuse.value = colorBuffer.texture;
	blur.material.uniforms.delta.value.set( 0, blurAmount );
	draw( blur, blurBuffers[ 0 ] );
	blur.material.uniforms.tDiffuse.value = blurBuffers[ 0 ].texture;
	blur.material.uniforms.delta.value.set( blurAmount, 0 );
	draw( blur, blurBuffers[ 1 ] );

	material.uniforms.renderDepth.value = 1;
	renderer.setClearColor( 0x808000 );
	renderer.setRenderTarget( normalBuffer );
	renderer.render( scene, camera );

	draw( final, null );

}

render();
</script>

	</body>
</html>
